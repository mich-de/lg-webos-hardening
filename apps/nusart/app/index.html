<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8">
<title>NusArt</title>
<link rel="stylesheet" href="main.css">
</head>
<body>
<div id="stage">
  <img id="s0" class="slide" alt="">
  <img id="s1" class="slide" alt="">
  <header id="topbar" class="ui">
    <div id="logo">Nus<span>Art</span></div>
    <div id="cat" class="chip" title="Cambia categoria">…</div>
    <div id="fav" class="chip" title="Sfondi salvati">★ 0</div>
    <div id="save" class="chip" title="Salva sfondo">⬇ Salva</div>
    <div id="fonte" class="hint">The Metropolitan Museum of Art · domain pubblico</div>
    <div id="clock">--:--:--</div>
  </header>
  <div id="caption" class="hidden ui">
    <div id="ctitle"></div>
    <div id="cmeta"></div>
  </div>
  <div id="wait" class="hidden">
    <div class="wicon"></div>
    <div class="wtitle"></div>
    <div class="wsub"></div>
    <div id="retry" class="rbtn">Riprova</div>
  </div>
  <div id="banner" class="hidden"></div>
  <footer id="hint" class="ui">Click interfaccia on/off · rotella o ← → opera · ↑ ↓ categoria · OK salta · tasti Play ★ salva sfondo · ★=preferiti · Back esci</footer>
  <div id="prog"><i></i></div>
</div>
<script src="main.js"></script>
</body></html>
